version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: karmabot_db
    restart: always
    environment:
      POSTGRES_USER: karma_user
      POSTGRES_PASSWORD: karma_password
      POSTGRES_DB: karmabot_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: